<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto | Glow Nails</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #ffe6f0, #ffffff);
}

/* HEADER */
.header {
  background: #f8c8dc;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 50px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.menu {
  display: flex;
  gap: 15px;
}

.menu a {
  background: white;
  padding: 10px 18px;
  border-radius: 20px;
  text-decoration: none;
  color: black;
  font-weight: bold;
  transition: 0.3s;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.menu a:hover {
  background: #ff69b4;
  color: white;
}

.acciones {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-btn {
  background: white;
  padding: 10px 15px;
  border-radius: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* CONTACTO */
.contacto {
  padding: 80px;
  text-align: center;
}

.contacto h1 {
  font-size: 40px;
}

.formulario {
  background: white;
  width: 350px;
  margin: 30px auto;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.1);
}

.formulario input,
.formulario textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #ddd;
}

.formulario button {
  width: 100%;
  padding: 12px;
  background: black;
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.formulario button:hover {
  background: #ff69b4;
}

/* INFO CARDS */
.info {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 40px;
  flex-wrap: wrap;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 200px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
}

/* 🔥 REDES SOCIALES */
.social {
  margin-top: 40px;
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
}

.social-btn {
  text-decoration: none;
  padding: 12px 18px;
  border-radius: 20px;
  font-weight: bold;
  color: white;
  transition: 0.3s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.social-btn:hover {
  transform: translateY(-3px);
}

.whatsapp {
  background: #25D366;
}

.insta {
  background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
}

.tiktok {
  background: black;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 30px;
  border-radius: 18px;
  width: 320px;
  text-align: center;
}

.modal input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

.close {
  float: right;
  cursor: pointer;
  font-size: 20px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="logo">💅 Glow Nails</div>

  <div class="menu">
    <a href="index.html">Inicio</a>
    <a href="cursos.html">Cursos</a>
    <a href="tienda.html">Tienda</a>
    <a href="contacto.html">Contacto</a>
  </div>

  <div id="userArea" class="acciones"></div>

</div>

<!-- CONTACTO -->
<div class="contacto">

  <h1>Contáctanos 💖</h1>
  <p>Escríbenos si quieres aprender uñas o tienes dudas</p>

  <div class="formulario">
    <input placeholder="Tu nombre">
    <input placeholder="Correo electrónico">
    <textarea rows="4" placeholder="Escribe tu mensaje..."></textarea>
    <button>Enviar mensaje</button>
  </div>

  <!-- INFO -->
  <div class="info">

    <div class="card">💅 Cursos online <p>Aprende desde casa</p></div>
    <div class="card">💖 Soporte <p>Respuesta rápida</p></div>
    <div class="card">✨ Comunidad <p>Aprende con otras personas</p></div>

  </div>

  <!-- 🔥 REDES SOCIALES -->
  <div class="social">

    <a href="https://wa.me/573012695225" target="_blank" class="social-btn whatsapp">
      💬 WhatsApp
    </a>

    <a href="https://instagram.com/nailsglow.byeve?igsh=cTlzNnA2cnF2YWNz" target="_blank" class="social-btn insta">
      📸 Instagram
    </a>

    <a href="https://tiktok.com" target="_blank" class="social-btn tiktok">
      🎵 TikTok
    </a>

  </div>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('loginModal')">❌</span>
    <h3>Iniciar sesión</h3>

    <input id="loginUser" placeholder="Usuario">
    <input id="loginPass" type="password" placeholder="Contraseña">

    <button onclick="login()">Entrar</button>

    <p onclick="openModal('registerModal')" style="cursor:pointer;color:blue;">
      Crear cuenta
    </p>
  </div>
</div>

<!-- REGISTER MODAL -->
<div id="registerModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('registerModal')">❌</span>
    <h3>Registro</h3>

    <input id="regUser" placeholder="Usuario">
    <input id="regPass" type="password" placeholder="Contraseña">

    <button onclick="register()">Crear cuenta</button>
  </div>
</div>

<!-- SCRIPT -->
<script>
function openModal(id){
  document.getElementById(id).style.display = "flex";
}

function closeModal(id){
  document.getElementById(id).style.display = "none";
}

/* REGISTRO */
function register(){
  let u = document.getElementById("regUser").value;
  let p = document.getElementById("regPass").value;

  localStorage.setItem("user_" + u, p);

  alert("Cuenta creada 💅");
  closeModal("registerModal");
  openModal("loginModal");
}

/* LOGIN */
function login(){
  let u = document.getElementById("loginUser").value;
  let p = document.getElementById("loginPass").value;

  let saved = localStorage.getItem("user_" + u);

  if(saved === p){
    localStorage.setItem("loggedUser", u);
    updateUser();
    closeModal("loginModal");
  } else {
    alert("Datos incorrectos");
  }
}

/* USUARIO GLOBAL */
function updateUser(){
  let u = localStorage.getItem("loggedUser");
  let box = document.getElementById("userArea");

  if(u){
    box.innerHTML = `
      <div class="user-btn">
        👤 ${u}
        <span onclick="logout()" style="margin-left:10px;cursor:pointer;">❌</span>
      </div>
    `;
  } else {
    box.innerHTML = `
      <a href="#" onclick="openModal('loginModal')">Iniciar sesión</a>
      <a href="#" onclick="openModal('registerModal')">Registrarse</a>
    `;
  }
}

/* LOGOUT */
function logout(){
  localStorage.removeItem("loggedUser");
  updateUser();
}

window.onload = function(){
  updateUser();
};
</script>

</body>
</html>
