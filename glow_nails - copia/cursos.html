        .cursos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

        }

        .curso {
            background-color: #fff5f8;
            padding: 15px;
            border-radius: 15px;
            text-align: center;

        .curso:hover {
            transform: scale(1.05);
        }

        .curso img {
            width: 100%;
            border-radius: 15px;
        }

        .curso h3 {
            margin: 15px 0 10px 0;
        }
